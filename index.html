<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Stylist - Body Analysis</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrapper">
    <div class="glass-card">
      <h1 class="title">AI Stylist</h1>
      <p class="subtitle">Your Personalized Body Analysis</p>

      <form id="profileForm" class="form">
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Email Address" required>

        <select id="gender" required>
          <option value="">Select Gender</option>
          <option value="female">Female</option>
          <option value="male">Male</option>
        </select>

        <div class="row two-col">
          <input type="number" id="height" placeholder="Height (cm)" required>
          <input type="number" id="weight" placeholder="Weight (kg)" required>
        </div>

        <div class="row three-col">
          <input type="number" id="chest" placeholder="Chest (cm)" required>
          <input type="number" id="waist" placeholder="Waist (cm)" required>
        </div>

        <button type="submit" class="btn">Analyze</button>
      </form>

      <div id="result" class="result-card hidden">
        <h2 id="bodyType" class="result-title"></h2>
        <p id="stylingTips" class="result-text"></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
