<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartGulak — Dashboard</title>
  <link rel="stylesheet" href="dashboard.css" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet" />
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">SG</div>
      <div class="brand-title">SmartGulak</div>
    </div>

    <ul class="nav">
      <li><a href="#"><i class="ri-home-5-line"></i><span class="label">Home</span></a></li>
      <li><a href="#"><i class="ri-exchange-dollar-line"></i><span class="label">Transaction</span></a></li>
      <li><a href="#"><i class="ri-user-3-line"></i><span class="label">Account</span></a></li>
      <li><a href="#"><i class="ri-flag-line"></i><span class="label">Goals</span></a></li>
      <li><a href="#"><i class="ri-piggy-bank-line"></i><span class="label">Savings</span></a></li>
      <li><a href="#"><i class="ri-price-tag-3-line"></i><span class="label">Category</span></a></li>
      <li><a href="#"><i class="ri-calendar-event-line"></i><span class="label">Calendar</span></a></li>
      <li><a href="#"><i class="ri-bar-chart-2-line"></i><span class="label">Reports</span></a></li>
      <li><a href="#"><i class="ri-customer-service-2-line"></i><span class="label">Support Request</span></a></li>
    </ul>

    <div class="spacer"></div>

    <div class="sidebar-user">
      <div class="user-info">
        <div class="avatar"><i class="ri-user-3-line"></i></div>
        <div class="username" id="sidebarUserName">—</div>
      </div>
      <button class="logout" id="logoutBtn" title="Logout"><i class="ri-logout-box-r-line"></i></button>
    </div>
  </aside>

  <main class="content">
    <div class="topbar">
      <button class="toggle" id="sidebarToggle" aria-label="Toggle sidebar"><i class="ri-menu-line"></i></button>
      <div></div>
    </div>
    <div class="inner">
      <h2>Welcome to SmartGulak</h2>
      <p class="placeholder">This is a demo dashboard. Your username appears in the sidebar footer after login.</p>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
